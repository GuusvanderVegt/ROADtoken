# .github/workflows/build.yml
name: Build ROADtoken
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: microsoft/setup-msbuild@v1
      - run: msbuild ROADtoken.sln /p:Configuration=Release
      - uses: actions/upload-artifact@v3
        with:
          name: ROADtoken
          path: bin\Release\ROADtoken.exe
